
# Whisper Configuration for Serbian ASR

model:
  pretrained_model: "openai/whisper-base"
  language: "Serbian"
  freeze_encoder: true
  freeze_n_layers: 0

data:
  raw_data_dir: "data/raw"
  batch_size: 4
  num_workers: 0
  pin_memory: false
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  sample_rate: 16000
  max_duration: 30.0

training:
  num_epochs: 5
  learning_rate: 1e-5
  warmup_steps: 500
  eval_steps: 100
  save_steps: 100
  gradient_accumulation_steps: 1
  mixed_precision: false
  gradient_checkpointing: false
  max_grad_norm: 1.0
  
  early_stopping:
    patience: 3
    min_delta: 0.001

paths:
  log_dir: "logs"
  checkpoint_dir: "models/checkpoints"
  best_model_path: "models/best_model.pt"
  tensorboard_dir: "logs/tensorboard"
